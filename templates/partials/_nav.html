<nav class="bg-neutral-900/95 backdrop-blur text-gray-100 flex justify-between items-center border-b border-gray-600 sticky top-0 z-40">
    <div class="flex items-stretch">
        <a href="{% url user.is_authenticated|yesno:'home:logged_in,home:home' %}"
           class="nav-link font-semibold w-28 text-center">Opera lab</a>
        {% if nav_top_links %}
            {% for item in nav_top_links %}
                <a href="{{ item.url }}"
                   class="nav-link {% if item.active %}nav-link--active{% endif %}">{{ item.label }}</a>
            {% endfor %}
        {% endif %}
    </div>
    <div class="flex items-center gap-3">
        {% if user.is_authenticated %}
            <a href="{% url 'users:profile_settings' %}"
               class="nav-link nav-link--muted">
                {{ user.first_name|default:user.username }}
                {% if user.last_name %}{{ user.last_name }}{% endif %}
            </a>
            <a href="{% url 'home:logout' %}" class="nav-link text-rose-300">Wyloguj sie</a>
        {% else %}
            <a href="{% url 'home:login' %}" class="nav-link text-lime-300">Zaloguj sie</a>
        {% endif %}
    </div>
</nav>
