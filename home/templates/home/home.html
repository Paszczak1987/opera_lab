{% extends "home/home_base.html" %}
{% block home_content %}
    <div class="bg-gray-700 rounded-2xl p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center text-gray-200 mb-6">Zaloguj się</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="bg-red-100 text-red-600 px-3 py-2 rounded-md text-sm">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
                <label for="{{ form.username.id_for_label }}"
                       class="block text-sm text-gray-400">Nazwa użytkownika</label>
                {{ form.username }}
            </div>
            <div>
                <label for="{{ form.password.id_for_label }}"
                       class="block text-sm text-gray-400">Hasło</label>
                {{ form.password }}
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 cursor-pointer transition">
                Zaloguj się
            </button>
        </form>
        <p class="text-center text-gray-400 text-sm mt-6">
            Nie masz konta? <a href="#" class="text-blue-300 hover:underline">Zarejestruj się</a>
        </p>
    </div>
{% endblock home_content %}
